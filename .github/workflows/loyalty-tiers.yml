name: Update Loyalty Tiers

on:
  schedule:
    - cron: '0 16 * * 0'   # Sunday 16:00 UTC = Monday ~5am NZDT (4am NZST), after Sunday's Recharge orders
  workflow_dispatch:       # "Run workflow" button in GitHub
    inputs:
      dry_run:
        description: 'Test run — report what would change, without changing anything'
        type: boolean
        default: true

concurrency:
  group: loyalty-tiers        # never run two tier updates at the same time
  cancel-in-progress: false

jobs:
  update-tiers:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run loyalty tier update
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          LOYALTY_TEAM_PASSWORD: ${{ secrets.LOYALTY_TEAM_PASSWORD }}
        run: python loyalty_tiers.py
